[workspace]
resolver = "2"
members = ["crates/lunchbox-app", "crates/lunchbox-db"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ben Booth"]
repository = "https://github.com/benwbooth/lunchbox"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cxx = "1.0"
cxx-qt = "0.8.1"
cxx-qt-build = "0.8.1"
cxx-qt-lib = { version = "0.8.1", features = ["qt_full"] }
csv = "1.3"
crc32fast = "1.4"
directories = "6.0"
flate2 = "1.1"
gilrs = "0.11.2"
hex = "0.4"
keyring = "4.1.6"
lava_torrent = "0.7"
md5 = { package = "md-5", version = "0.10" }
rmpv = "1.3"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
reflink-copy = "0.1.30"
rars = "0.9.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sevenz-rust2 = { version = "0.22.2", features = ["brotli", "deflate", "lz4", "zstd"] }
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "3.1", features = ["cookies", "json", "multipart"] }
url = "2.5"
uuid = { version = "1.11", features = ["serde", "v4", "v5"] }
walkdir = "2.5"
zip = "8.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
