MEMORY {
    ZP:      start = $000000, size = $000100, type = rw, file = "";
    RAM:     start = $7e0000, size = $020000, type = rw, file = "";
    ROM:     start = $008000, size = $007fc0, type = ro, file = %O, fill = yes, fillval = $ff;
    HEADER:  start = $00ffc0, size = $000020, type = ro, file = %O, fill = yes, fillval = $00;
    VECTORS: start = $00ffe0, size = $000020, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    BSS:      load = RAM, type = bss;
    CODE:     load = ROM, type = ro;
    HEADER:   load = HEADER, type = ro;
    VECTORS:  load = VECTORS, type = ro;
}
