[package]
name = "lunchbox-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[features]
# Nix/ROCm builds opt into MIGraphX against their matching ONNX Runtime.
# Portable bundles currently lack a GPU OCR provider and disable translation
# rather than silently running OCR on the CPU.
rocm-ocr = ["rapidocr-core/migraphx"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
chd = "=0.3.4"
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
crc32fast.workspace = true
directories.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
base64 = "0.22"
font8x8 = "0.3"
fontdb = { version = "0.24", features = ["fontconfig"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
fs2.workspace = true
gilrs.workspace = true
hex.workspace = true
keyring.workspace = true
lava_torrent.workspace = true
md5.workspace = true
opendal.workspace = true
quick-xml = "0.37"
toml_edit = "0.25.13"
rusqlite.workspace = true
reflink-copy.workspace = true
rfd.workspace = true
rars.workspace = true
serde.workspace = true
serde_json.workspace = true
sevenz-rust2.workspace = true
sha1.workspace = true
sha2.workspace = true
tar.workspace = true
suppaftp.workspace = true
tokio.workspace = true
tracing.workspace = true
ureq.workspace = true
url.workspace = true
uuid.workspace = true
walkdir.workspace = true
sysinfo.workspace = true
zip.workspace = true
# MAME's own CHD reader: linked so compressed disc images (CHD/CDZ) work on
# every host without a chdman install.
libchdman-rs.workspace = true
tempfile = "3.14"
lunchbox-controller-probe = { path = "../lunchbox-controller-probe" }
lunchbox-patching = { path = "../lunchbox-patching" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rapidocr-core = { version = "0.2.2" }

[target.'cfg(target_os = "macos")'.dependencies]
rapidocr-core = { version = "0.2.2", features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
rapidocr-core = { version = "0.2.2", features = ["directml"] }

[build-dependencies]
cxx-qt-build.workspace = true
quick-xml = "0.37"


[[bin]]
name = "lunchbox"
path = "src/main.rs"
