<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Retro metal lunchbox with a gamepad emblem">
  <defs>
    <linearGradient id="handleMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9b5c5"/>
      <stop offset="0.32" stop-color="#657287"/>
      <stop offset="0.58" stop-color="#273544"/>
      <stop offset="1" stop-color="#718097"/>
    </linearGradient>
    <linearGradient id="caseMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#95a2b6"/>
      <stop offset="0.18" stop-color="#526176"/>
      <stop offset="0.48" stop-color="#1b2735"/>
      <stop offset="0.72" stop-color="#657287"/>
      <stop offset="1" stop-color="#2b3647"/>
    </linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffc579"/>
      <stop offset="0.48" stop-color="#f2a13b"/>
      <stop offset="1" stop-color="#c9792f"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2b3a"/>
      <stop offset="1" stop-color="#0f1722"/>
    </linearGradient>
  </defs>

  <!-- Heavy chrome handle, drawn behind the case. -->
  <path d="M79 80V57c0-18 14-32 32-32h34c18 0 32 14 32 32v23"
        fill="none" stroke="#0b111a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M79 80V57c0-18 14-32 32-32h34c18 0 32 14 32 32v23"
        fill="none" stroke="url(#handleMetal)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M105 37h46" fill="none" stroke="#f4f7fb" stroke-opacity="0.46" stroke-width="4" stroke-linecap="round"/>

  <!-- Latches sit above the stamped body like an old metal school lunchbox. -->
  <g stroke="#0b111a" stroke-width="6" stroke-linejoin="round">
    <path d="M49 67h34v32H49z" fill="url(#caseMetal)"/>
    <path d="M173 67h34v32h-34z" fill="url(#caseMetal)"/>
  </g>
  <path d="M57 76h18v13H57zm124 0h18v13h-18z" fill="#273544"/>

  <!-- Rounded steel shell and inset painted panel. -->
  <rect x="17" y="80" width="222" height="156" rx="27" fill="#0b111a"/>
  <rect x="24" y="87" width="208" height="142" rx="21" fill="url(#caseMetal)"/>
  <rect x="36" y="99" width="184" height="118" rx="13" fill="url(#paint)" stroke="#111923" stroke-width="5"/>
  <path d="M42 113h172" stroke="#f4f7fb" stroke-opacity="0.42" stroke-width="5" stroke-linecap="round"/>
  <path d="M42 202h172" stroke="#62dac8" stroke-opacity="0.72" stroke-width="5" stroke-linecap="round"/>

  <!-- A little stamped-metal wear without muddying the silhouette. -->
  <path d="M53 129l21-12m-15 78l24-12m107-61l14-8m-20 86l19-11" stroke="#f4f7fb" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round"/>
  <g fill="#657287" stroke="#dce2eb" stroke-width="2">
    <circle cx="38" cy="101" r="5"/>
    <circle cx="218" cy="101" r="5"/>
    <circle cx="38" cy="215" r="5"/>
    <circle cx="218" cy="215" r="5"/>
  </g>

  <!-- Recessed badge and clean gamepad mark. -->
  <path d="M77 137c5-17 19-27 36-27h30c17 0 31 10 36 27l12 38c4 13-10 24-22 16l-22-15h-38l-22 15c-12 8-26-3-22-16z"
        fill="url(#badge)" stroke="#62dac8" stroke-width="6" stroke-linejoin="round"/>
  <path d="M96 136v29m-14-14h29" stroke="#f4f7fb" stroke-width="10" stroke-linecap="round"/>
  <circle cx="157" cy="142" r="7" fill="#62dac8"/>
  <circle cx="174" cy="157" r="7" fill="#f2a13b"/>
  <circle cx="126" cy="166" r="4" fill="#95a2b6"/>
  <circle cx="140" cy="166" r="4" fill="#95a2b6"/>
</svg>
