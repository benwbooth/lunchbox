name: Native packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: 6.8.3

jobs:
  nix:
    name: Nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check flake outputs
        run: nix flake check --print-build-logs
      - name: Build Lunchpail
        run: nix build .#lunchpail --print-build-logs

  windows:
    name: Windows MSI and portable ZIP
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtimageformats qtmultimedia qtquick3d qtshadertools
          cache: true
      - name: Fetch the pinned MAME CHD archive
        shell: pwsh
        run: |
          $url = 'https://github.com/danifunker/libchdman-rs/releases/download/v0.289.0/libchdman_rs-x86_64-pc-windows-msvc.lib'
          $archive = Join-Path $env:RUNNER_TEMP 'libchdman_rs.lib'
          Invoke-WebRequest $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '52bab595cf1efa4d218f11b9cffa5961c56cfb1b5813071b194b2f46f3ffedb9') { throw 'MAME CHD archive checksum mismatch' }
          "LIBCHDMAN_PREBUILT_LOCAL_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build release executable
        run: cargo build --locked --release --package lunchpail-app --package lunchpail-controller-probe --bin lunchpail --bin lunchpail-controller-probe
      - name: Stage Qt runtime and database
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'dist\Lunchpail'
          New-Item -ItemType Directory -Force "$stage\bin", "$stage\share\lunchpail" | Out-Null
          Copy-Item 'target\release\lunchpail.exe' "$stage\bin\lunchpail.exe"
          Copy-Item 'target\release\lunchpail-controller-probe.exe' "$stage\bin\lunchpail-controller-probe.exe"
          $sdlArchive = Join-Path $env:RUNNER_TEMP 'SDL3-3.4.12-x64.zip'
          Invoke-WebRequest 'https://github.com/libsdl-org/SDL/releases/download/release-3.4.12/SDL3-3.4.12-win32-x64.zip' -OutFile $sdlArchive
          if ((Get-FileHash $sdlArchive -Algorithm SHA256).Hash.ToLower() -ne '326e9f5ae2cbab478c03a9e2b22a560e5a9358b5f5eed8e61f5a7c8333750cf1') { throw 'SDL3 archive checksum mismatch' }
          $sdlStage = Join-Path $env:RUNNER_TEMP 'lunchpail-sdl3'
          Expand-Archive $sdlArchive -DestinationPath $sdlStage -Force
          Copy-Item (Get-ChildItem $sdlStage -Recurse -Filter SDL3.dll | Select-Object -First 1).FullName "$stage\bin\SDL3.dll"
          Get-ChildItem $sdlStage -Recurse -Filter 'LICENSE*' | ForEach-Object { Copy-Item $_.FullName "$stage\share\lunchpail\SDL3-LICENSE.txt" }
          cargo run --locked --release --package lunchpail-db -- extract --archive 'artifacts\lunchpail.db.7z' --output "$stage\share\lunchpail"
          windeployqt --release --qmldir 'crates\lunchpail-app\qml' "$stage\bin\lunchpail.exe"
          if (-not (Test-Path "$stage\share\lunchpail\lunchpail.db")) { throw 'database staging failed' }
      - name: Build portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist\Lunchpail' -DestinationPath 'dist\Lunchpail-windows-x86_64.zip' -CompressionLevel Optimal -Force
      - name: Build MSI
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'lunchpail-app' }).version
          dotnet tool install --global wix --version 5.0.0
          wix build packaging\windows\Lunchpail.wxs -arch x64 -d "StageDir=$((Resolve-Path 'dist\Lunchpail').Path)" -d "Version=$version" -o dist\Lunchpail-windows-x86_64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: Lunchpail-windows-x86_64
          path: |
            dist/Lunchpail-windows-x86_64.zip
            dist/Lunchpail-windows-x86_64.msi
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS arm64 DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtimageformats qtmultimedia qtquick3d qtshadertools
          cache: true
      - name: Fetch the pinned MAME CHD archive
        run: |
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then NAME=aarch64-apple-darwin; SUM=5e1e58f6797882859dbc784516120e740e178539b81802d36383894cd347ec6c; else NAME=x86_64-apple-darwin; SUM=bcbba685a725c8e846d334bfa6de93a3ee2b1debd052d5565bce7a501cfe8be8; fi
          ARCHIVE="$RUNNER_TEMP/libchdman_rs.a"
          curl -sSL -o "$ARCHIVE" "https://github.com/danifunker/libchdman-rs/releases/download/v0.289.0/libchdman_rs-$NAME.a"
          echo "$SUM  $ARCHIVE" | shasum -a 256 -c -
          echo "LIBCHDMAN_PREBUILT_LOCAL_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - name: Build release executable
        run: cargo build --locked --release --package lunchpail-app --package lunchpail-controller-probe --bin lunchpail --bin lunchpail-controller-probe
      - name: Assemble application bundle
        run: |
          rm -rf dist/Lunchpail.app
          mkdir -p dist/Lunchpail.app/Contents/MacOS dist/Lunchpail.app/Contents/share/lunchpail
          install -m 0755 target/release/lunchpail dist/Lunchpail.app/Contents/MacOS/lunchpail
          install -m 0755 target/release/lunchpail-controller-probe dist/Lunchpail.app/Contents/MacOS/lunchpail-controller-probe
          sdl_source="$(mktemp -d "${RUNNER_TEMP}/lunchpail-sdl3.XXXXXX")"
          curl --fail --location --retry 3 https://github.com/libsdl-org/SDL/releases/download/release-3.4.12/SDL3-3.4.12.tar.gz -o "$sdl_source/source.tar.gz"
          echo "f07b958a9ac5020fb7a44cadb957f658b2149c3c8abb4f63145fac9303249db7  $sdl_source/source.tar.gz" | shasum -a 256 -c -
          tar -xzf "$sdl_source/source.tar.gz" -C "$sdl_source" --strip-components=1
          cmake -S "$sdl_source" -B "$sdl_source/build" -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_VIDEO=OFF -DSDL_AUDIO=OFF
          cmake --build "$sdl_source/build" --config Release --parallel 3
          cp -L "$sdl_source/build/libSDL3.0.dylib" dist/Lunchpail.app/Contents/MacOS/libSDL3.dylib
          install -m 0644 "$sdl_source/LICENSE.txt" dist/Lunchpail.app/Contents/share/lunchpail/SDL3-LICENSE.txt
          install -m 0644 packaging/macos/Info.plist dist/Lunchpail.app/Contents/Info.plist
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lunchpail-app") | .version')"
          plutil -replace CFBundleShortVersionString -string "$version" dist/Lunchpail.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "${GITHUB_RUN_NUMBER}" dist/Lunchpail.app/Contents/Info.plist
          cargo run --locked --release --package lunchpail-db -- extract --archive artifacts/lunchpail.db.7z --output dist/Lunchpail.app/Contents/share/lunchpail
          macdeployqt dist/Lunchpail.app -qmldir=crates/lunchpail-app/qml -always-overwrite
          codesign --force --deep --sign - dist/Lunchpail.app
          test -f dist/Lunchpail.app/Contents/share/lunchpail/lunchpail.db
      - name: Build and verify DMG
        shell: bash
        env:
          DMG_ARCH: arm64
        run: |
          set -euo pipefail

          output="$PWD/dist/Lunchpail-macos-${DMG_ARCH}.dmg"
          staging="$(mktemp -d "${RUNNER_TEMP}/lunchpail-dmg.XXXXXX")"
          mountpoint_dir="$(mktemp -d "${RUNNER_TEMP}/lunchpail-mount.XXXXXX")"
          mounted=false

          cleanup() {
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$mountpoint_dir" -force >/dev/null 2>&1 || true
            fi
            rm -rf -- "$staging" "$mountpoint_dir"
          }
          trap cleanup EXIT

          ditto --rsrc --extattr --acl dist/Lunchpail.app "$staging/Lunchpail.app"
          ln -s /Applications "$staging/Applications"
          sync

          created=false
          for attempt in 1 2 3 4; do
            rm -f -- "$output"
            if hdiutil create \
                -volname Lunchpail \
                -srcfolder "$staging" \
                -fs HFS+ \
                -format UDZO \
                -imagekey zlib-level=9 \
                "$output"; then
              created=true
              break
            fi
            if [[ "$attempt" -eq 4 ]]; then
              echo "hdiutil could not create the DMG after $attempt attempts" >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "hdiutil reported a transient failure; retrying in ${delay}s" >&2
            sleep "$delay"
          done
          [[ "$created" == true && -s "$output" ]]

          hdiutil verify "$output"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint_dir" "$output"
          mounted=true
          test -x "$mountpoint_dir/Lunchpail.app/Contents/MacOS/lunchpail"
          test -f "$mountpoint_dir/Lunchpail.app/Contents/share/lunchpail/lunchpail.db"
          test "$(readlink "$mountpoint_dir/Applications")" = /Applications
          codesign --verify --deep --strict "$mountpoint_dir/Lunchpail.app"

          packaged_arches="$(lipo -archs "$mountpoint_dir/Lunchpail.app/Contents/MacOS/lunchpail")"
          case " $packaged_arches " in
            *" $DMG_ARCH "*) ;;
            *)
              echo "DMG executable architectures '$packaged_arches' do not include '$DMG_ARCH'" >&2
              exit 1
              ;;
          esac

          hdiutil detach "$mountpoint_dir"
          mounted=false
      - uses: actions/upload-artifact@v4
        with:
          name: Lunchpail-macos-arm64
          path: dist/Lunchpail-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 14

  appimage:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev libgl1-mesa-dev libpulse-dev libudev-dev libwayland-dev libxkbcommon-dev patchelf
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtimageformats qtmultimedia qtquick3d qtshadertools
          cache: true
      - name: Fetch the pinned MAME CHD archive
        run: |
          ARCHIVE="$RUNNER_TEMP/libchdman_rs.a"
          curl -sSL -o "$ARCHIVE" "https://github.com/danifunker/libchdman-rs/releases/download/v0.289.0/libchdman_rs-x86_64-unknown-linux-gnu-glibc2.35.a"
          echo "5340f4e65d0fd0c40d5b1dd3c6ad1d5daa653ddb7f93affb70f0480cbc781a17  $ARCHIVE" | sha256sum -c -
          echo "LIBCHDMAN_PREBUILT_LOCAL_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - name: Build release executable
        run: cargo build --locked --release --no-default-features --package lunchpail-app --package lunchpail-controller-probe --bin lunchpail --bin lunchpail-controller-probe
      - name: Stage AppDir
        run: |
          rm -rf dist/AppDir dist/appimage-assets
          mkdir -p dist/AppDir/usr/bin dist/AppDir/usr/share/lunchpail dist/appimage-assets
          install -m 0755 target/release/lunchpail dist/AppDir/usr/bin/lunchpail
          install -m 0755 target/release/lunchpail-controller-probe dist/AppDir/usr/bin/lunchpail-controller-probe
          install -m 0644 assets/lunchpail.svg dist/appimage-assets/io.github.benwbooth.Lunchpail.svg
          cargo run --locked --release --package lunchpail-db -- extract --archive artifacts/lunchpail.db.7z --output dist/AppDir/usr/share/lunchpail
          test -f dist/AppDir/usr/share/lunchpail/lunchpail.db
      - name: Fetch pinned linuxdeploy tools
        run: |
          curl --fail --location --silent --show-error -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl --fail --location --silent --show-error -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy' | sha256sum --check
          echo '15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt' | sha256sum --check
          chmod +x linuxdeploy linuxdeploy-plugin-qt
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          EXTRA_QT_PLUGINS: imageformats;multimedia
          OUTPUT: dist/Lunchpail-linux-x86_64.AppImage
          QML_SOURCES_PATHS: crates/lunchpail-app/qml
        run: ./linuxdeploy --appdir dist/AppDir --desktop-file packaging/io.github.benwbooth.Lunchpail.desktop --icon-file dist/appimage-assets/io.github.benwbooth.Lunchpail.svg --executable dist/AppDir/usr/bin/lunchpail --plugin qt --output appimage
      - name: Verify AppImage payload
        run: |
          chmod +x dist/Lunchpail-linux-x86_64.AppImage
          cd dist
          ./Lunchpail-linux-x86_64.AppImage --appimage-extract >/dev/null
          test -f squashfs-root/usr/share/lunchpail/lunchpail.db
      - uses: actions/upload-artifact@v4
        with:
          name: Lunchpail-linux-x86_64
          path: dist/Lunchpail-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  flatpak:
    name: Linux Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify locked Flatpak Cargo sources
        run: |
          rustc --edition=2024 -D warnings --test packaging/flatpak/verify-cargo-sources.rs -o /tmp/verify-cargo-sources-tests
          /tmp/verify-cargo-sources-tests
          rustc --edition=2024 -D warnings packaging/flatpak/verify-cargo-sources.rs -o /tmp/verify-cargo-sources
          /tmp/verify-cargo-sources Cargo.lock packaging/flatpak/cargo-sources.json
      - name: Build bundle and repository
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Lunchpail-linux-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.benwbooth.Lunchpail.yml
          repo-dir: repo
          cache-key: flatpak-${{ hashFiles('Cargo.lock', 'packaging/flatpak/io.github.benwbooth.Lunchpail.yml', 'packaging/flatpak/cargo-sources.json') }}
          upload-artifact: false
      - name: Archive update repository reproducibly
        run: tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf Lunchpail-flatpak-repo.tar.gz repo
      - uses: actions/upload-artifact@v4
        with:
          name: Lunchpail-flatpak-x86_64
          path: |
            Lunchpail-linux-x86_64.flatpak
            Lunchpail-flatpak-repo.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nix, windows, macos, appimage, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Generate checksums and Homebrew cask
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lunchpail-app") | .version')"
          test "$version" = "$cargo_version"
          arm_dmg="release/Lunchpail-macos-arm64/Lunchpail-macos-arm64.dmg"
          arm_sha="$(sha256sum "$arm_dmg" | cut -d' ' -f1)"
          sed -e "s/@VERSION@/$version/g" -e "s/@ARM64_SHA256@/$arm_sha/g" packaging/homebrew/lunchpail.rb.in > release/lunchpail.rb
          find release -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/**/*.msi
            release/**/*.zip
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.flatpak
            release/**/*flatpak-repo.tar.gz
            release/lunchpail.rb
            release/SHA256SUMS
