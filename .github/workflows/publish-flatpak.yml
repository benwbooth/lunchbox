name: Publish Flatpak repository

on:
  workflow_dispatch:
  # Releases created with GITHUB_TOKEN do not fire another release workflow.
  workflow_run:
    workflows: [Native packages]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-flatpak.yml
      - packaging/flatpak/prepare-repository.py
      - packaging/flatpak/download.html
      - packaging/flatpak/signing-key.asc

permissions:
  contents: read

concurrency:
  group: flatpak-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
    steps:
      # Always use the trusted default branch, never workflow_run's head ref.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y flatpak
      - name: Check release and archive validation
        run: python3 -m unittest discover -s packaging/flatpak -p 'test_*.py'
      - name: Prepare verified release assets
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        run: |
          args=(--output "$RUNNER_TEMP/site")
          if [ "$FORCE_PUBLISH" = true ]; then args+=(--force); fi
          python3 packaging/flatpak/prepare-repository.py "${args[@]}"
      - name: Sign application and repository metadata
        if: steps.prepare.outputs.publish == 'true'
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          test -n "$FLATPAK_GPG_PRIVATE_KEY"
          signing_home="$RUNNER_TEMP/flatpak-signing"
          install -d -m 700 "$signing_home"
          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --homedir "$signing_home" --batch --import
          key_id="$(gpg --show-keys --with-colons packaging/flatpak/signing-key.asc | awk -F: '$1 == "fpr" {print $10; exit}')"
          gpg --homedir "$signing_home" --list-secret-keys "$key_id"
          flatpak build-sign --gpg-homedir="$signing_home" --gpg-sign="$key_id" "$RUNNER_TEMP/site/flatpak"
          flatpak build-update-repo --gpg-homedir="$signing_home" --gpg-sign="$key_id" \
            --title=Lunchpail --default-branch=master --generate-static-deltas \
            --prune --prune-depth=1 "$RUNNER_TEMP/site/flatpak"
          test -s "$RUNNER_TEMP/site/flatpak/summary.sig"
      - uses: actions/upload-pages-artifact@v3
        if: steps.prepare.outputs.publish == 'true'
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
