name: Libretro runtime audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-input:
    name: Windows core oracle (${{ matrix.core }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: mgba
            system: gba
            secondary_system: gameboy
            persistence_system: gba
            secondary_persistence_system: gameboy-mgba
            persistence_expect: pass
            expected_version: '0.11-219-e31759b'
            expected_state_bytes: 430144
            secondary_expected_state_bytes: 202816
          - core: genesis_plus_gx
            system: gamegear
            persistence_system: game-gear
            persistence_expect: pass
            expected_version: 'v1.7.4 c2838c7'
            expected_state_bytes: 1036288
          - core: stella
            system: atari2600
            persistence_system: atari2600-stella
            persistence_expect: pass
            expected_version: '8.0_pre c65c845'
            expected_state_bytes: 1041
          - core: fceumm
            system: nes
            persistence_system: nes-fceumm
            persistence_expect: pass
            expected_version: '(SVN) 236ccdf'
            expected_state_bytes: 13758
          - core: mesen
            system: nes
            persistence_system: nes-mesen
            persistence_expect: pass
            expected_version: '0.9.9'
            expected_state_bytes: 35840
          - core: bsnes
            system: snes
            persistence_system: bsnes
            persistence_expect: blocked
            expected_version: '115'
            expected_state_bytes: ''
          - core: snes9x
            system: snes
            persistence_system: snes9x
            persistence_expect: pass
            expected_version: '1.63 890b5d4'
            expected_state_bytes: 823407
          - core: sameboy
            system: gameboy
            secondary_system: ''
            persistence_system: gameboy-sameboy
            persistence_expect: pass
            expected_version: '1.0.3 8230189'
            expected_state_bytes: 252666
          - core: gambatte
            system: gameboy
            secondary_system: ''
            persistence_system: gameboy-gambatte
            persistence_expect: pass
            expected_version: 'v0.5.0-netlink d9d6cd0'
            expected_state_bytes: 59650
          - core: skyemu
            system: gameboy
            secondary_system: gba
            persistence_system: gameboy-skyemu
            secondary_persistence_system: gba-skyemu
            persistence_expect: pass
            expected_version: 'adacd0788964ed89f5c43dcbc1f3cc26deec996c'
            expected_state_bytes: 246416
            secondary_expected_state_bytes: 581832
          - core: vbam
            system: gameboy
            secondary_system: gba
            persistence_system: gameboy-vbam
            secondary_persistence_system: gba-vbam
            persistence_expect: pass
            expected_version: '2.1.3 115defb'
            expected_state_bytes: 115948
            secondary_expected_state_bytes: 723452
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build bounded direct-core oracle
        run: >-
          cargo build --locked --release --package lunchbox-controller-probe
          --bin lunchbox-libretro-input --bin lunchbox-libretro-persistence
      - name: Download and execute official core
        shell: bash
        env:
          CORE: ${{ matrix.core }}
          SYSTEM: ${{ matrix.system }}
          SECONDARY_SYSTEM: ${{ matrix.secondary_system }}
          PERSISTENCE_SYSTEM: ${{ matrix.persistence_system }}
          SECONDARY_PERSISTENCE_SYSTEM: ${{ matrix.secondary_persistence_system }}
          PERSISTENCE_EXPECT: ${{ matrix.persistence_expect }}
          EXPECTED_VERSION: ${{ matrix.expected_version }}
          EXPECTED_STATE_BYTES: ${{ matrix.expected_state_bytes }}
          SECONDARY_EXPECTED_STATE_BYTES: ${{ matrix.secondary_expected_state_bytes }}
        run: |
          set -euo pipefail

          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          evidence="$runner_temp/lunchbox-libretro-${CORE}"
          mkdir -p "$evidence/unpacked"
          url="https://buildbot.libretro.com/nightly/windows/x86_64/latest/${CORE}_libretro.dll.zip"
          curl --fail --location --retry 3 "$url" -o "$evidence/core.zip"
          unzip -q "$evidence/core.zip" -d "$evidence/unpacked"
          core_path="$(find "$evidence/unpacked" -type f -name "${CORE}_libretro.dll" -print -quit)"
          test -n "$core_path"
          core_sha256="$(sha256sum "$core_path" | cut -d ' ' -f 1)"
          archive_sha256="$(sha256sum "$evidence/core.zip" | cut -d ' ' -f 1)"
          oracle="$workspace/target/release/lunchbox-libretro-input.exe"

          printf '{\n  "source_url": "%s",\n  "archive_sha256": "%s",\n  "core_sha256": "%s"\n}\n' \
            "$url" "$archive_sha256" "$core_sha256" > "$evidence/download.json"

          run_oracle() {
            local label="$1"
            local oracle_system="$2"
            shift 2
            if ! "$oracle" \
              --core "$core_path" \
              --sha256 "$core_sha256" \
              --system "$oracle_system" \
              --output "$evidence/${label}.json" \
              "$@" \
              > "$evidence/${label}.stdout" \
              2> "$evidence/${label}.stderr"; then
              cat "$evidence/${label}.stderr" >&2
              return 1
            fi
          }

          run_input_suite() {
            local oracle_system="$1"
            local label_prefix="$2"
            case "$oracle_system" in
            gba|gamegear|gameboy|atari2600)
              run_oracle "${label_prefix}individual" "$oracle_system"
              if [[ "$CORE" != skyemu ]]; then
                run_oracle "${label_prefix}bitmask" "$oracle_system" --bitmask
              fi
              ;;
            nes)
              run_oracle "${label_prefix}two-player-individual" "$oracle_system" --nes-topology two-player
              run_oracle "${label_prefix}two-player-bitmask" "$oracle_system" --nes-topology two-player --bitmask
              run_oracle "${label_prefix}four-score-individual" "$oracle_system" --nes-topology four-score
              run_oracle "${label_prefix}four-score-bitmask" "$oracle_system" --nes-topology four-score --bitmask
              ;;
            snes)
              run_oracle "${label_prefix}two-player-individual" "$oracle_system" --snes-topology two-player
              run_oracle "${label_prefix}multitap-individual" "$oracle_system" --snes-topology multitap
              if [[ "$CORE" != bsnes ]]; then
                run_oracle "${label_prefix}two-player-bitmask" "$oracle_system" --snes-topology two-player --bitmask
                run_oracle "${label_prefix}multitap-bitmask" "$oracle_system" --snes-topology multitap --bitmask
              fi
              ;;
            *)
              echo "Unsupported system: $oracle_system" >&2
              exit 2
              ;;
            esac
          }

          run_oracle identity "$SYSTEM" --identity-only
          run_input_suite "$SYSTEM" ''

          if [[ -n "$SECONDARY_SYSTEM" ]]; then
            run_input_suite "$SECONDARY_SYSTEM" "${SECONDARY_SYSTEM}-"
          fi

          persistence="$workspace/target/release/lunchbox-libretro-persistence.exe"
          run_persistence() {
            local label="$1"
            local persistence_system="$2"
            local expected_state_bytes="$3"
            persistence_args=(
              --core "$core_path"
              --sha256 "$core_sha256"
              --system "$persistence_system"
              --expected-version "$EXPECTED_VERSION"
              --output "$evidence/$label"
            )
            if [[ -n "$expected_state_bytes" ]]; then
              persistence_args+=(--expected-state-bytes "$expected_state_bytes")
            fi
            if [[ "$PERSISTENCE_EXPECT" == blocked ]]; then
              if "$persistence" "${persistence_args[@]}" \
                > "$evidence/${label}.stdout" \
                2> "$evidence/${label}.stderr"; then
                echo 'bsnes unexpectedly passed the direct-memory persistence oracle' >&2
                exit 1
              fi
              grep -F \
                'bsnes 115 deliberately exposes neither save RAM nor system RAM through the libretro memory interface' \
                "$evidence/${label}.stderr"
            elif ! "$persistence" "${persistence_args[@]}" \
              > "$evidence/${label}.stdout" \
              2> "$evidence/${label}.stderr"; then
                cat "$evidence/${label}.stderr" >&2
                exit 1
            fi
          }

          if [[ -n "$PERSISTENCE_SYSTEM" ]]; then
            run_persistence persistence "$PERSISTENCE_SYSTEM" "$EXPECTED_STATE_BYTES"
          fi
          if [[ -n "$SECONDARY_PERSISTENCE_SYSTEM" ]]; then
            run_persistence persistence-secondary \
              "$SECONDARY_PERSISTENCE_SYSTEM" "$SECONDARY_EXPECTED_STATE_BYTES"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libretro-windows-${{ matrix.core }}
          path: ${{ runner.temp }}/lunchbox-libretro-${{ matrix.core }}
          if-no-files-found: warn
          retention-days: 14

  windows-arcade:
    name: Windows arcade oracle (${{ matrix.core }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: fbneo
            expected_archive_sha256: 8389e62bbd370282ea408db1498e0e64b443c346530e7fee650d551c5aaffc76
            expected_core_sha256: 4e097b6a1587ad58c3292e885ce218ec8eb8fbecebdf82a51489eb16f95ac3ca
            expected_core_name: FinalBurn Neo
            expected_core_version: 'v1.0.0.03 260904 GITa251c76'
            expected_source_commit: a251c76229f1637e433b93e29845039752771b6d
            expected_state_bytes: 15288
            timeout_seconds: 120
          - core: mame
            expected_archive_sha256: 77d38183ba995e8bb3e2f514e680d30645eae3b8aad78d6b62026d166c664590
            expected_core_sha256: b38c9ebb2cf679745701569c511f9c381e1f4f3f43e0212fe728397b0badbead
            expected_core_name: MAME
            expected_core_version: '0.289 (4fc9a931)'
            expected_source_commit: 4fc9a9312baaf34963847f884961ad9793fbbc1d
            expected_state_bytes: 4568435
            timeout_seconds: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build bounded arcade oracle
        run: >-
          cargo build --locked --release --package lunchbox-controller-probe
          --bin lunchbox-libretro-input --bin lunchbox-libretro-arcade-oracle
      - name: Verify core and run arcade oracle when content is available
        shell: bash
        env:
          ARCADE_CONTENT_URL: ${{ secrets.LIBRETRO_ARCADE_1943_URL }}
          CORE: ${{ matrix.core }}
          EXPECTED_ARCHIVE_SHA256: ${{ matrix.expected_archive_sha256 }}
          EXPECTED_CORE_SHA256: ${{ matrix.expected_core_sha256 }}
          EXPECTED_CORE_NAME: ${{ matrix.expected_core_name }}
          EXPECTED_CORE_VERSION: ${{ matrix.expected_core_version }}
          EXPECTED_SOURCE_COMMIT: ${{ matrix.expected_source_commit }}
          EXPECTED_STATE_BYTES: ${{ matrix.expected_state_bytes }}
          TIMEOUT_SECONDS: ${{ matrix.timeout_seconds }}
        run: |
          set -euo pipefail

          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          evidence="$runner_temp/lunchbox-libretro-arcade-${CORE}"
          core_root="$runner_temp/lunchbox-libretro-arcade-core-${CORE}"
          content_root="$runner_temp/lunchbox-libretro-arcade-content-${CORE}"
          mkdir -p "$evidence" "$core_root/unpacked" "$content_root"

          result_status=failed
          result_reason='The Windows arcade audit failed before completion.'
          write_result() {
            RESULT_PATH="$evidence/result.json" \
            RESULT_STATUS="$result_status" \
            RESULT_REASON="$result_reason" \
            python - <<'PY'
          import json
          import os

          with open(os.environ["RESULT_PATH"], "w", encoding="utf-8") as output:
              json.dump({
                  "schema_version": 1,
                  "status": os.environ["RESULT_STATUS"],
                  "reason": os.environ["RESULT_REASON"],
              }, output, indent=2)
              output.write("\n")
          PY
          }
          trap write_result EXIT

          core_url="https://buildbot.libretro.com/nightly/windows/x86_64/latest/${CORE}_libretro.dll.zip"
          core_archive="$core_root/${CORE}_libretro.dll.zip"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            "$core_url" -o "$core_archive"
          archive_sha256="$(sha256sum "$core_archive" | cut -d ' ' -f 1)"
          printf 'source_url=%s\nexpected_archive_sha256=%s\nobserved_archive_sha256=%s\n' \
            "$core_url" "$EXPECTED_ARCHIVE_SHA256" "$archive_sha256" \
            > "$evidence/core-download.txt"
          if [[ "$archive_sha256" != "$EXPECTED_ARCHIVE_SHA256" ]]; then
            result_reason='Official core archive SHA-256 differs from the pinned Windows artifact.'
            exit 1
          fi

          unzip -q "$core_archive" -d "$core_root/unpacked"
          core_path="$(find "$core_root/unpacked" -type f -name "${CORE}_libretro.dll" -print -quit)"
          if [[ -z "$core_path" ]]; then
            result_reason='Pinned core archive did not contain the expected DLL.'
            exit 1
          fi
          core_sha256="$(sha256sum "$core_path" | cut -d ' ' -f 1)"
          printf 'expected_core_sha256=%s\nobserved_core_sha256=%s\n' \
            "$EXPECTED_CORE_SHA256" "$core_sha256" >> "$evidence/core-download.txt"
          if [[ "$core_sha256" != "$EXPECTED_CORE_SHA256" ]]; then
            result_reason='Core DLL SHA-256 differs from the pinned Windows artifact.'
            exit 1
          fi

          result_reason='Pinned core identity-only inspection failed or returned an unexpected name/version.'
          identity_oracle="$workspace/target/release/lunchbox-libretro-input.exe"
          "$identity_oracle" \
            --core "$core_path" \
            --sha256 "$EXPECTED_CORE_SHA256" \
            --identity-only \
            --output "$evidence/core-identity.json" \
            > "$evidence/core-identity.stdout" \
            2> "$evidence/core-identity.stderr"
          IDENTITY_PATH="$evidence/core-identity.json" \
          EXPECTED_CORE_NAME="$EXPECTED_CORE_NAME" \
          EXPECTED_CORE_VERSION="$EXPECTED_CORE_VERSION" \
          python - <<'PY'
          import json
          import os

          with open(os.environ["IDENTITY_PATH"], encoding="utf-8") as source:
              identity = json.load(source)
          if identity["core_name"] != os.environ["EXPECTED_CORE_NAME"]:
              raise SystemExit(
                  f"core name mismatch: observed {identity['core_name']!r}, "
                  f"expected {os.environ['EXPECTED_CORE_NAME']!r}"
              )
          if identity["core_version"] != os.environ["EXPECTED_CORE_VERSION"]:
              raise SystemExit(
                  f"core version mismatch: observed {identity['core_version']!r}, "
                  f"expected {os.environ['EXPECTED_CORE_VERSION']!r}"
              )
          PY

          if [[ -z "$ARCADE_CONTENT_URL" ]]; then
            result_status=blocked
            result_reason='LIBRETRO_ARCADE_1943_URL is unavailable; core identity was verified, but no game bytes were downloaded or executed.'
            exit 0
          fi

          content="$content_root/1943.zip"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            "$ARCADE_CONTENT_URL" -o "$content"
          content_bytes="$(wc -c < "$content" | tr -d '[:space:]')"
          content_sha256="$(sha256sum "$content" | cut -d ' ' -f 1)"
          printf 'source=LIBRETRO_ARCADE_1943_URL\nexpected_bytes=805560\nobserved_bytes=%s\nexpected_sha256=%s\nobserved_sha256=%s\n' \
            "$content_bytes" \
            e44b89e80bf8bccc4f16476d7254d959d937a1668d27ec564d57103ac94fba6f \
            "$content_sha256" > "$evidence/content-receipt.txt"
          if [[ "$content_bytes" != 805560 ]]; then
            result_reason='User-supplied 1943.zip byte count differs from the pinned content.'
            exit 1
          fi
          if [[ "$content_sha256" != e44b89e80bf8bccc4f16476d7254d959d937a1668d27ec564d57103ac94fba6f ]]; then
            result_reason='User-supplied 1943.zip SHA-256 differs from the pinned content.'
            exit 1
          fi

          arcade_oracle="$workspace/target/release/lunchbox-libretro-arcade-oracle.exe"
          run_oracle() {
            local mode="$1"
            shift
            "$arcade_oracle" \
              --profile "$CORE" \
              --core "$core_path" \
              --expected-core-sha256 "$EXPECTED_CORE_SHA256" \
              --expected-core-version "$EXPECTED_CORE_VERSION" \
              --expected-source-commit "$EXPECTED_SOURCE_COMMIT" \
              --expected-state-bytes "$EXPECTED_STATE_BYTES" \
              --content "$content" \
              --output "$evidence/$mode" \
              --timeout-seconds "$TIMEOUT_SECONDS" \
              "$@" \
              > "$evidence/${mode}.stdout" \
              2> "$evidence/${mode}.stderr"
          }

          oracle_failed=0
          if ! run_oracle individual; then
            cat "$evidence/individual.stderr" >&2
            oracle_failed=1
          fi
          if ! run_oracle bitmask --bitmask; then
            cat "$evidence/bitmask.stderr" >&2
            oracle_failed=1
          fi
          if [[ "$oracle_failed" != 0 ]]; then
            result_reason='One or both pinned Windows arcade callback-mode runs failed.'
            exit 1
          fi

          CORE="$CORE" EVIDENCE="$evidence" python - <<'PY'
          import json
          import os

          expected_collisions = {
              (1, "Coin", ("P2 Coin",)),
              (2, "Coin", ("P1 Coin",)),
          }
          for mode in ("individual", "bitmask"):
              with open(
                  os.path.join(os.environ["EVIDENCE"], mode, "report.json"),
                  encoding="utf-8",
              ) as source:
                  report = json.load(source)
              if report["profile"] != os.environ["CORE"]:
                  raise SystemExit(f"{mode}: unexpected profile")
              if report["status"] != "partial":
                  raise SystemExit(f"{mode}: expected explicit partial status")
              responses = report["responses"]
              promoted = [item for item in responses if item["promoted_as_distinguished"]]
              collisions = {
                  (
                      item["player"],
                      item["control"],
                      tuple(item["collision_with"]),
                  )
                  for item in responses
                  if not item["promoted_as_distinguished"]
              }
              if len(responses) != 22 or len(promoted) != 20:
                  raise SystemExit(f"{mode}: expected 20 of 22 distinguished channels")
              if collisions != expected_collisions:
                  raise SystemExit(f"{mode}: unexpected undistinguished-channel boundary")
              if not report["state_restore"]["same_process_exact"]:
                  raise SystemExit(f"{mode}: same-process state restoration was not exact")
          PY

          result_status=partial
          result_reason='Pinned Windows arcade core completed both callback modes with 20 of 22 distinct channels; the shared-credit and fresh-process state boundaries remain explicit in each report.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libretro-windows-${{ matrix.core }}-arcade
          path: ${{ runner.temp }}/lunchbox-libretro-arcade-${{ matrix.core }}
          if-no-files-found: warn
          retention-days: 14

  windows-psx-firmware-boundary:
    name: Windows PSX firmware boundary (${{ matrix.core }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: mednafen_psx
            persistence_system: psx-beetle
            expected_version: '0.9.44.1 82d8e05'
            expected_state_bytes: 16777216
          - core: mednafen_psx_hw
            persistence_system: psx-beetle-hw
            expected_version: '0.9.44.1 82d8e05'
            expected_state_bytes: 16777216
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build bounded PSX oracles
        run: >-
          cargo build --locked --release --package lunchbox-controller-probe
          --bin lunchbox-libretro-input --bin lunchbox-libretro-persistence
      - name: Pin core identity and verify the absent-firmware boundary
        shell: bash
        env:
          CORE: ${{ matrix.core }}
          PERSISTENCE_SYSTEM: ${{ matrix.persistence_system }}
          EXPECTED_VERSION: ${{ matrix.expected_version }}
          EXPECTED_STATE_BYTES: ${{ matrix.expected_state_bytes }}
        run: |
          set -euo pipefail

          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          evidence="$runner_temp/lunchbox-libretro-${CORE}-firmware-boundary"
          mkdir -p "$evidence/unpacked" "$evidence/empty-bios"
          url="https://buildbot.libretro.com/nightly/windows/x86_64/latest/${CORE}_libretro.dll.zip"
          curl --fail --location --retry 3 "$url" -o "$evidence/core.zip"
          unzip -q "$evidence/core.zip" -d "$evidence/unpacked"
          core_path="$(find "$evidence/unpacked" -type f -name "${CORE}_libretro.dll" -print -quit)"
          test -n "$core_path"
          core_sha256="$(sha256sum "$core_path" | cut -d ' ' -f 1)"
          archive_sha256="$(sha256sum "$evidence/core.zip" | cut -d ' ' -f 1)"
          input="$workspace/target/release/lunchbox-libretro-input.exe"
          persistence="$workspace/target/release/lunchbox-libretro-persistence.exe"

          "$input" \
            --core "$core_path" \
            --sha256 "$core_sha256" \
            --identity-only \
            --output "$evidence/identity.json"
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["core_version"])' "$evidence/identity.json")" = "$EXPECTED_VERSION"

          if "$input" \
            --core "$core_path" \
            --sha256 "$core_sha256" \
            --system psx \
            --bios-dir "$evidence/empty-bios" \
            --output "$evidence/input.json" \
            > "$evidence/input.stdout" \
            2> "$evidence/input.stderr"; then
            echo 'PSX input unexpectedly ran without the required BIOS set' >&2
            exit 1
          fi
          grep -F 'Reading required BIOS' "$evidence/input.stderr"
          grep -F 'scph5500.bin' "$evidence/input.stderr"

          if "$persistence" \
            --core "$core_path" \
            --sha256 "$core_sha256" \
            --system "$PERSISTENCE_SYSTEM" \
            --expected-version "$EXPECTED_VERSION" \
            --expected-state-bytes "$EXPECTED_STATE_BYTES" \
            --bios-dir "$evidence/empty-bios" \
            --output "$evidence/persistence" \
            > "$evidence/persistence.stdout" \
            2> "$evidence/persistence.stderr"; then
            echo 'PSX persistence unexpectedly ran without the required BIOS set' >&2
            exit 1
          fi
          grep -F 'scph5500.bin' "$evidence/persistence.stderr"

          python - "$evidence/result.json" "$url" "$archive_sha256" "$core_sha256" <<'PY'
          import json
          import sys

          path, url, archive_sha256, core_sha256 = sys.argv[1:]
          with open(path, "w", encoding="utf-8") as output:
              json.dump({
                  "schema_version": 1,
                  "status": "pass",
                  "source_url": url,
                  "archive_sha256": archive_sha256,
                  "core_sha256": core_sha256,
                  "controller_test_status": "blocked",
                  "firmware_test_status": "blocked",
                  "save_test_status": "blocked",
                  "state_test_status": "blocked",
                  "reason": "No user-supplied PSX BIOS was available on the hosted Windows VM; both strict oracles rejected the empty BIOS directory before content execution.",
              }, output, indent=2)
              output.write("\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libretro-windows-${{ matrix.core }}-firmware-boundary
          path: ${{ runner.temp }}/lunchbox-libretro-${{ matrix.core }}-firmware-boundary
          if-no-files-found: warn
          retention-days: 14

  windows-unavailable:
    name: Windows unavailable core (mesen-s)
    runs-on: windows-2025
    steps:
      - name: Verify official artifact is absent
        shell: bash
        run: |
          set -euo pipefail
          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          evidence="$runner_temp/lunchbox-libretro-mesen-s-unavailable"
          mkdir -p "$evidence"
          url='https://buildbot.libretro.com/nightly/windows/x86_64/latest/mesen_s_libretro.dll.zip'
          status="$(curl --location --silent --show-error --output "$evidence/response" --write-out '%{http_code}' "$url")"
          printf 'source_url=%s\nhttp_status=%s\n' "$url" "$status" > "$evidence/result.txt"
          test "$status" = 404
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libretro-windows-mesen-s-unavailable
          path: ${{ runner.temp }}/lunchbox-libretro-mesen-s-unavailable
          if-no-files-found: warn
          retention-days: 14
