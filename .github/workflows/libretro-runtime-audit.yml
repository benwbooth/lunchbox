name: Libretro runtime audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-input:
    name: Windows core oracle (${{ matrix.core }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: mgba
            system: gba
            persistence_system: gba
            expected_version: '0.11-219-e31759b'
            expected_state_bytes: 430144
          - core: genesis_plus_gx
            system: gamegear
            persistence_system: game-gear
            expected_version: 'v1.7.4 c2838c7'
            expected_state_bytes: 1036288
          - core: fceumm
            system: nes
            persistence_system: nes-fceumm
            expected_version: '(SVN) 236ccdf'
            expected_state_bytes: 13758
          - core: mesen
            system: nes
            persistence_system: nes-mesen
            expected_version: '0.9.9'
            expected_state_bytes: 35840
          - core: bsnes
            system: snes
            persistence_system: ''
            expected_version: '115'
            expected_state_bytes: 0
          - core: snes9x
            system: snes
            persistence_system: snes9x
            expected_version: '1.63 890b5d4'
            expected_state_bytes: 823407
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build bounded direct-core oracle
        run: >-
          cargo build --locked --release --package lunchbox-controller-probe
          --bin lunchbox-libretro-input --bin lunchbox-libretro-persistence
      - name: Download and execute official core
        shell: bash
        env:
          CORE: ${{ matrix.core }}
          SYSTEM: ${{ matrix.system }}
          PERSISTENCE_SYSTEM: ${{ matrix.persistence_system }}
          EXPECTED_VERSION: ${{ matrix.expected_version }}
          EXPECTED_STATE_BYTES: ${{ matrix.expected_state_bytes }}
        run: |
          set -euo pipefail

          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          evidence="$runner_temp/lunchbox-libretro-${CORE}"
          mkdir -p "$evidence/unpacked"
          url="https://buildbot.libretro.com/nightly/windows/x86_64/latest/${CORE}_libretro.dll.zip"
          curl --fail --location --retry 3 "$url" -o "$evidence/core.zip"
          unzip -q "$evidence/core.zip" -d "$evidence/unpacked"
          core_path="$(find "$evidence/unpacked" -type f -name "${CORE}_libretro.dll" -print -quit)"
          test -n "$core_path"
          core_sha256="$(sha256sum "$core_path" | cut -d ' ' -f 1)"
          archive_sha256="$(sha256sum "$evidence/core.zip" | cut -d ' ' -f 1)"
          oracle="$workspace/target/release/lunchbox-libretro-input.exe"

          printf '{\n  "source_url": "%s",\n  "archive_sha256": "%s",\n  "core_sha256": "%s"\n}\n' \
            "$url" "$archive_sha256" "$core_sha256" > "$evidence/download.json"

          run_oracle() {
            local label="$1"
            shift
            if ! "$oracle" \
              --core "$core_path" \
              --sha256 "$core_sha256" \
              --system "$SYSTEM" \
              --output "$evidence/${label}.json" \
              "$@" \
              > "$evidence/${label}.stdout" \
              2> "$evidence/${label}.stderr"; then
              cat "$evidence/${label}.stderr" >&2
              return 1
            fi
          }

          run_oracle identity --identity-only

          case "$SYSTEM" in
            gba|gamegear)
              run_oracle individual
              run_oracle bitmask --bitmask
              ;;
            nes)
              run_oracle two-player-individual --nes-topology two-player
              run_oracle two-player-bitmask --nes-topology two-player --bitmask
              run_oracle four-score-individual --nes-topology four-score
              run_oracle four-score-bitmask --nes-topology four-score --bitmask
              ;;
            snes)
              run_oracle two-player-individual --snes-topology two-player
              run_oracle multitap-individual --snes-topology multitap
              if [[ "$CORE" != bsnes ]]; then
                run_oracle two-player-bitmask --snes-topology two-player --bitmask
                run_oracle multitap-bitmask --snes-topology multitap --bitmask
              fi
              ;;
            *)
              echo "Unsupported system: $SYSTEM" >&2
              exit 2
              ;;
          esac

          if [[ -n "$PERSISTENCE_SYSTEM" ]]; then
            persistence="$workspace/target/release/lunchbox-libretro-persistence.exe"
            if ! "$persistence" \
              --core "$core_path" \
              --sha256 "$core_sha256" \
              --system "$PERSISTENCE_SYSTEM" \
              --expected-version "$EXPECTED_VERSION" \
              --expected-state-bytes "$EXPECTED_STATE_BYTES" \
              --output "$evidence/persistence" \
              > "$evidence/persistence.stdout" \
              2> "$evidence/persistence.stderr"; then
              cat "$evidence/persistence.stderr" >&2
              exit 1
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libretro-windows-${{ matrix.core }}
          path: ${{ runner.temp }}/lunchbox-libretro-${{ matrix.core }}
          if-no-files-found: warn
          retention-days: 14
